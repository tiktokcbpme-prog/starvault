<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarVault</title>
    <style>
        body {
            background-color: #090a0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        .card {
            background: #13151f;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn {
            background: linear-gradient(135deg, #00f2fe, #10b981);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>StarVault 💎</h1>
    <div class="card">
        <h3>Balance: <span id="balance">$0.000</span></h3>
    </div>

    <div class="card">
        <p>Click test button:</p>
        <button class="btn" onclick="testClick()">Click Me!</button>
    </div>

    <script>
        let balance = parseFloat(localStorage.getItem('test_balance')) || 0;
        document.getElementById('balance').innerText = '$' + balance.toFixed(3);

        function testClick() {
            balance += 0.003;
            localStorage.setItem('test_balance', balance);
            document.getElementById('balance').innerText = '$' + balance.toFixed(3);
            alert('Working perfectly! Balance updated.');
        }
    </script>
</body>
</html>
