<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarVault</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad-index.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .balance-card {
            background: linear-gradient(135deg, #1e293b, #334155);
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 24px;
            border: 1px solid #475569;
        }
        .balance-title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .balance-amount {
            font-size: 36px;
            font-weight: bold;
            color: #f59e0b;
        }
        .section-title {
            width: 100%;
            max-width: 400px;
            font-size: 18px;
            margin-bottom: 12px;
            color: #cbd5e1;
            text-align: left;
        }
        .task-list {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .task-item {
            background-color: #1e293b;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }
        .task-info h4 {
            font-size: 15px;
            margin-bottom: 4px;
        }
        .task-info p {
            font-size: 13px;
            color: #f59e0b;
            font-weight: bold;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⭐ StarVault ⭐</h1>
        <p style="color: #94a3b8; font-size: 14px; margin-top: 4px;">Earn Stars & Complete Tasks</p>
    </div>

    <!-- Balance Section -->
    <div class="balance-card">
        <div class="balance-title">Your Balance</div>
        <div class="balance-amount"><span id="starsCount">0</span> ⭐</div>
    </div>

    <!-- Tasks Section -->
    <div class="section-title">Tasks</div>
    <div class="task-list">
        
        <!-- Adsgram Task -->
        <div class="task-item">
            <div class="task-info">
                <h4>Watch Video Ad</h4>
                <p>+50 Stars</p>
            </div>
            <button class="btn" onclick="watchAd()">Watch</button>
        </div>

        <!-- Daily Reward -->
        <div class="task-item">
            <div class="task-info">
                <h4>Daily Check-in</h4>
                <p>+100 Stars</p>
            </div>
            <button class="btn" id="dailyBtn" onclick="claimDaily()">Claim</button>
        </div>
<!-- Telegram Channel Join -->
        <div class="task-item">
            <div class="task-info">
                <h4>Join Community</h4>
                <p>+200 Stars</p>
            </div>
            <button class="btn" onclick="openChannel()">Join</button>
        </div>

    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Load saved balance from LocalStorage
        let stars = parseInt(localStorage.getItem('starVault_stars')) || 0;
        document.getElementById('starsCount').innerText = stars;

        // Initialize Adsgram with Block ID 45999
        const AdController = window.Adsgram.init({ blockId: "45999" });

        // Function to Watch Ad via Adsgram
        function watchAd() {
            AdController.show().then((result) => {
                addStars(50);
                tg.showAlert("Success! You earned 50 Stars!");
            }).catch((result) => {
                tg.showAlert("Ad was not completed or failed to load.");
            });
        }

        // Daily Claim
        function claimDaily() {
            const lastClaim = localStorage.getItem('starVault_lastClaim');
            const today = new Date().toDateString();

            if (lastClaim === today) {
                tg.showAlert("You have already claimed today's reward!");
            } else {
                addStars(100);
                localStorage.setItem('starVault_lastClaim', today);
                document.getElementById('dailyBtn').disabled = true;
                document.getElementById('dailyBtn').innerText = "Claimed";
                tg.showAlert("You claimed 100 Stars!");
            }
        }

        // Open Telegram Channel Task
        function openChannel() {
            tg.openTelegramLink("https://t.me/StarVault_Real_bot");
            addStars(200);
        }

        // Helper function to add stars and persist data
        function addStars(amount) {
            stars += amount;
            localStorage.setItem('starVault_stars', stars);
            document.getElementById('starsCount').innerText = stars;
        }

        // Check daily button status on load
        if (localStorage.getItem('starVault_lastClaim') === new Date().toDateString()) {
            document.getElementById('dailyBtn').disabled = true;
            document.getElementById('dailyBtn').innerText = "Claimed";
        }
    </script>
</body>
</html>
