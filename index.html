<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarVault</title>
    <!-- Adsgram Script Integration -->
    <script src="https://sad.adsgram.ai/js/adsgram.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #090d16;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #131c2e;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #1e293b;
        }
        .wallet-info {
            text-align: left;
        }
        .wallet-info small {
            color: #94a3b8;
            font-size: 12px;
        }
        .wallet-info h3 {
            margin: 2px 0 0 0;
            color: #38bdf8;
            font-size: 20px;
        }
        .ads-counter {
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #fbbf24;
            font-weight: bold;
        }
        .section-title {
            text-align: left;
            font-size: 16px;
            margin: 20px 0 10px 5px;
            color: #cbd5e1;
        }
        .task-card {
            background: #131c2e;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            border: 1px solid #1e293b;
        }
        .task-info strong {
            font-size: 15px;
            color: #f8fafc;
        }
        .task-info small {
            color: #94a3b8;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        button:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header & Wallet -->
        <div class="header">
            <div class="wallet-info">
                <small>Wallet Balance</small>
                <h3 id="balance">$0.00</h3>
            </div>
            <div class="ads-counter">
                🎁 Ads: <span id="ads-left">5</span>/5
            </div>
        </div>

        <div class="section-title">Earning Tasks</div>

        <!-- Watch Ad Task -->
        <div class="task-card">
            <div class="task-info">
                <strong>Watch Video Ad</strong><br>
                <small>Earn $0.05 per ad</small>
            </div>
            <button id="watch-btn" onclick="showAd()">Watch</button>
        </div>

        <!-- Daily Check-in Task -->
        <div class="task-card">
            <div class="task-info">
                <strong>Daily Check-in</strong><br>
                <small>Earn $0.10 daily</small>
            </div>
            <button id="checkin-btn" onclick="dailyCheckIn()">Claim</button>
        </div>

        <!-- Join Community Task -->
        <div class="task-card">
            <div class="task-info">
                <strong>Join Community</strong><br>
                <small>Earn $0.20 bonus</small>
            </div>
            <button id="join-btn" onclick="joinCommunity()">Join</button>
        </div>
    </div>
    <script>
        // Load data from LocalStorage
        let balance = parseFloat(localStorage.getItem('starvault_usd_balance')) || 0.00;
        let adsLeft = parseInt(localStorage.getItem('starvault_ads_left'));
        if (isNaN(adsLeft)) adsLeft = 5;

        // Update UI
        document.getElementById('balance').innerText = "$" + balance.toFixed(2);
        document.getElementById('ads-left').innerText = adsLeft;

        if (adsLeft <= 0) {
            document.getElementById('watch-btn').disabled = true;
            document.getElementById('watch-btn').innerText = "Limit";
        }

        function updateBalance(amount) {
            balance += amount;
            document.getElementById('balance').innerText = "$" + balance.toFixed(2);
            localStorage.setItem('starvault_usd_balance', balance);
        }

        // Adsgram initialization with Block ID 46002
        const adController = window.Adsgram ? window.Adsgram.init({ blockId: "46002" }) : null;

        function showAd() {
            if (adsLeft <= 0) {
                alert("You have reached your daily ad limit!");
                return;
            }

            if (adController) {
                adController.show().then(() => {
                    updateBalance(0.05);
                    adsLeft--;
                    document.getElementById('ads-left').innerText = adsLeft;
                    localStorage.setItem('starvault_ads_left', adsLeft);

                    if (adsLeft <= 0) {
                        document.getElementById('watch-btn').disabled = true;
                        document.getElementById('watch-btn').innerText = "Limit";
                    }
                    alert("Success! You earned $0.05");
                }).catch((result) => {
                    alert("Ad was not completed or failed to load.");
                });
            } else {
                alert("Adsgram script is not loaded properly.");
            }
        }

        function dailyCheckIn() {
            let lastCheckIn = localStorage.getItem('last_checkin_date');
            let today = new Date().toDateString();

            if (lastCheckIn === today) {
                alert("You have already claimed your daily reward today!");
                return;
            }

            updateBalance(0.10);
            localStorage.setItem('last_checkin_date', today);
            document.getElementById('checkin-btn').innerText = "Claimed";
            document.getElementById('checkin-btn').disabled = true;
            alert("Daily check-in successful! +$0.10");
        }

        function joinCommunity() {
            window.open('https://t.me/Star_Vault_Official', '_blank');
            updateBalance(0.20);
            document.getElementById('join-btn').innerText = "Done";
            document.getElementById('join-btn').disabled = true;
        }
    </script>
</body>
</html>
